<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 256" width="200" height="256">
  <!-- メイジ系1段目「理術士」（INT＝労働生理）／素体A・髪B（あご丈・センター分け）焦げ茶。文字は入れない。 -->
